name: Refresh Google Trends data

on:
  schedule:
    - cron: "20 5 * * *" # daily, 05:20 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytrends

      - name: Fetch trends
        run: python tools/fetch_trends.py

      - name: Commit updated trends.json
        run: |
          if git diff --quiet -- trends.json; then
            echo "trends.json unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "trends-bot"
          git config user.email "actions@github.com"
          git add trends.json
          git commit -m "chore: daily Google Trends refresh"
          git push
